[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ust"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "psycopg2>=2.9.12",
    "pyodbc>=5.3.0",
    "pywin32>=311",
    "selenium>=4.43.0",
    "sqlalchemy>=2.0.49",
    "tabulate>=0.10.0",
]

[project.scripts]
ust = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ust*"]
